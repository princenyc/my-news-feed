<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Signal: Tactical Intelligence v4.8</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --bg: #050505; --accent: #ff3e3e; --news: #ff4444; --sports: #44aaff; --culture: #ffaa44; --panel: rgba(15, 15, 15, 0.9); }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #fff; margin: 0; overflow: hidden; display: flex; }
        
        #map { height: 100vh; flex-grow: 1; background: #000; }
        .leaflet-tile { filter: brightness(0.3) contrast(1.2) grayscale(1) invert(1) opacity(0.3); }

        /* HUD & Sidebar Layout */
        .hud {
            position: absolute; top: 20px; left: 20px; width: 320px; z-index: 1000;
            background: var(--panel); border: 1px solid #333; border-radius: 12px;
            padding: 20px; backdrop-filter: blur(10px); box-shadow: 0 0 30px rgba(0,0,0,1);
        }
        .national-sidebar {
            width: 400px; height: 100vh; background: #0a0a0a; border-left: 1px solid #333;
            overflow-y: auto; padding: 25px; z-index: 1001;
        }
        
        h1 { font-size: 1.2rem; color: var(--accent); letter-spacing: 2px; margin: 0; text-transform: uppercase; }
        .status-bar { font-size: 0.6rem; color: #0f0; margin: 5px 0 15px 0; font-family: monospace; border-bottom: 1px solid #333; padding-bottom: 10px; }
        
        .filter-item { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 0.7rem; font-weight: 700; cursor: pointer; opacity: 0.8; transition: 0.2s; }
        .filter-item:hover { opacity: 1; color: var(--accent); }
        .dot { height: 8px; width: 8px; border-radius: 50%; }

        /* National Story Cards */
        .story-card { background: #151515; border: 1px solid #222; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .story-card h3 { font-size: 0.9rem; margin: 0 0 8px 0; line-height: 1.3; }
        .story-card a { color: #fff; text-decoration: none; font-weight: 700; }
        .story-card a:hover { color: var(--accent); }
        .source-tag { font-size: 0.6rem; font-weight: 800; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; margin-bottom: 8px; display: inline-block; }
    </style>
</head>
<body>

    <div class="hud">
        <h1>The Signal</h1>
        <div class="status-bar" id="status">SCANNING FREQUENCIES...</div>
        <div class="filter-item" onclick="toggleLayer('news')"><div class="dot" style="background:var(--news)"></div> NEWS & POLICY</div>
        <div class="filter-item" onclick="toggleLayer('sports')"><div class="dot" style="background:var(--sports)"></div> SPORTS & LABOR</div>
        <div class="filter-item" onclick="toggleLayer('entertainment')"><div class="dot" style="background:var(--culture)"></div> CULTURE & ARTS</div>
        <div class="filter-item" onclick="toggleWeather()"><div class="dot" style="background:#fff"></div> WEATHER RADAR</div>
    </div>

    <div id="map"></div>

    <div class="national-sidebar">
        <h2 style="font-size: 0.8rem; color: #666; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px;">National Intel Feed</h2>
        <div id="national-feed"></div>
    </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // 1. Deep Scan Geography Database
    const GEODATA = {
        "atlanta": [33.7490, -84.3880], "the a": [33.7490, -84.3880],
        "chicago": [41.8781, -87.6298], "detroit": [42.3314, -83.0458],
        "baltimore": [39.2904, -76.6122], "philly": [39.9526, -75.1652], "philadelphia": [39.9526, -75.1652],
        "houston": [29.7604, -95.3698], "new orleans": [29.9511, -90.0715], "nola": [29.9511, -90.0715],
        "harlem": [40.8116, -73.9465], "brooklyn": [40.6782, -73.9442], "nyc": [40.7128, -74.0060],
        "dc": [38.9072, -77.0369], "washington": [38.9072, -77.0369]
    };

    // 2. Intelligence Sources
    const SOURCES = [
        { name: "Capital B", url: "https://capitalbnews.org/feed/", cat: "news", color: "#ff4444" },
        { name: "Atlanta Voice", url: "https://theatlantavoice.com/feed/", cat: "news", color: "#ff4444" },
        { name: "Amsterdam News", url: "https://amsterdamnews.com/feed/", cat: "news", color: "#ff4444" },
        { name: "Black Enterprise", url: "https://www.blackenterprise.com/feed/", cat: "news", color: "#ff4444" },
        { name: "Andscape", url: "https://andscape.com/feed", cat: "sports", color: "#44aaff" },
        { name: "UrbanGeekz", url: "https://urbangeekz.com/feed/", cat: "news", color: "#00ffcc" },
        { name: "Blavity", url: "https://blavity.com/categories/news/entertainment/feed", cat: "entertainment", color: "#ffaa44" }
    ];

    let map, weatherRadar;
    // Logical Layer Groups
    let layers = { news: L.layerGroup(), sports: L.layerGroup(), entertainment: L.layerGroup() };

    function initMap() {
        map = L.map('map', { zoomControl: false, attributionControl: false }).setView([37.8, -96], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        
        // Populate all layers on start
        Object.values(layers).forEach(l => l.addTo(map));
        
        weatherRadar = L.tileLayer('https://tile.openweathermap.org/map/precipitation_new/{z}/{x}/{y}.png?appid=YOUR_API_KEY');
        fetchFeeds();
    }

    async function fetchFeeds() {
        let located = 0, national = 0;
        document.getElementById('national-feed').innerHTML = "";

        for (const src of SOURCES) {
            try {
                const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(src.url)}`);
                const data = await res.json();
                
                data.items.forEach(item => {
                    const hoursOld = (new Date() - new Date(item.pubDate)) / 3600000;
                    // Strict 24H Hard Filter
                    if (hoursOld <= 24) {
                        const coords = deepScan(item.title + " " + item.description);
                        if (coords) {
                            createPin(item, coords, src);
                            located++;
                        } else {
                            createCard(item, src);
                            national++;
                        }
                    }
                });
            } catch (e) { console.error("Sync Failed: " + src.name); }
        }
        document.getElementById('status').innerText = `LOCATED: ${located} | NATIONAL: ${national}`;
    }

    function deepScan(text) {
        const content = text.toLowerCase();
        for (const [city, coord] of Object.entries(GEODATA)) {
            if (content.includes(city)) return coord;
        }
        return null;
    }

    function createPin(item, coords, src) {
        // "The Spider" Jitter logic for blooming clusters
        const jitter = () => (Math.random() - 0.5) * 0.15; 
        const marker = L.circleMarker([coords[0] + jitter(), coords[1] + jitter()], {
            radius: 10, fillColor: src.color, color: "#fff", weight: 2, fillOpacity: 0.9
        }).addTo(layers[src.cat]);

        marker.bindPopup(`<div style="min-width:180px; font-family:Inter; color:#fff;">
            <div style="font-size:0.6rem; color:${src.color}; font-weight:800; margin-bottom:4px;">${src.name.toUpperCase()}</div>
            <a href="${item.link}" target="_blank" style="color:#ff3e3e; font-weight:bold; text-decoration:none;">${item.title}</a>
        </div>`);
    }

    function createCard(item, src) {
        const card = document.createElement('div');
        card.className = `story-card category-${src.cat}`; 
        card.innerHTML = `
            <div class="source-tag" style="background:${src.color}">${src.name}</div>
            <h3><a href="${item.link}" target="_blank">${item.title}</a></h3>
            <p style="font-size:0.7rem; color:#666; margin:0;">${item.description.replace(/<[^>]*>?/gm, '').substring(0, 80)}...</p>
        `;
        document.getElementById('national-feed').appendChild(card);
    }

    // Toggle logic for HUD and Sidebar sync
    function toggleLayer(t) {
        if (map.hasLayer(layers[t])) {
            map.removeLayer(layers[t]);
            document.querySelectorAll(`.category-${t}`).forEach(el => el.style.display = 'none');
        } else {
            map.addLayer(layers[t]);
            document.querySelectorAll(`.category-${t}`).forEach(el => el.style.display = 'block');
        }
    }

    function toggleWeather() {
        map.hasLayer(weatherRadar) ? map.removeLayer(weatherRadar) : weatherRadar.addTo(map);
    }

    initMap();
</script>
</body>
</html>
