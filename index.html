<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Signal: Black News Engine</title>
    <style>
        :root { --bg: #ffffff; --text: #1a1a1a; --accent: #666; --border: #000; --card: #f9f9f9; }
        [data-theme="dark"] { --bg: #121212; --text: #e0e0e0; --accent: #aaa; --border: #fff; --card: #1e1e1e; }
        body { font-family: 'Georgia', serif; max-width: 850px; margin: 0 auto; padding: 20px; background: var(--bg); color: var(--text); line-height: 1.5; transition: 0.3s; }
        .top-nav { display: flex; justify-content: flex-end; margin-bottom: 10px; }
        .theme-toggle { background: none; border: 1px solid var(--text); color: var(--text); padding: 5px 10px; cursor: pointer; font-family: sans-serif; font-size: 0.7rem; }
        .ticker-wrap { background: #000; color: #fff; padding: 10px; margin-bottom: 20px; overflow: hidden; white-space: nowrap; font-family: sans-serif; font-size: 0.8rem; text-transform: uppercase; }
        .ticker { display: inline-block; animation: marquee 60s linear infinite; padding-left: 100%; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
        .header { border-bottom: 3px double var(--text); padding-bottom: 10px; margin-bottom: 30px; text-align: center; }
        h1 { font-size: 2.5rem; margin: 0; font-variant: small-caps; }
        #searchBar { width: 100%; padding: 12px; margin-bottom: 30px; border: 1px solid var(--text); background: var(--bg); color: var(--text); font-family: sans-serif; box-sizing: border-box; }
        .article { margin-bottom: 40px; border-bottom: 1px solid var(--accent); padding-bottom: 20px; }
        .meta { font-family: sans-serif; font-size: 0.7rem; color: var(--accent); font-weight: bold; letter-spacing: 1px; margin-bottom: 5px; }
        .article h2 { font-size: 1.6rem; margin: 0 0 10px 0; line-height: 1.2; }
        .article a { color: var(--text); text-decoration: none; }
        .sum-btn { background: none; border: 1px solid var(--text); color: var(--text); padding: 5px 10px; font-family: sans-serif; font-size: 0.7rem; cursor: pointer; margin-top: 10px; }
        .summary-box { display: none; background: var(--card); padding: 15px; margin-top: 10px; font-family: sans-serif; font-size: 0.9rem; border-left: 4px solid var(--text); }
        .score-tag { background: rgba(128,128,128,0.1); padding: 2px 8px; border-radius: 15px; font-size: 0.65rem; margin-left: 10px; color: var(--accent); }
        .impact-badge { color: #d44; font-weight: bold; border: 1px solid #d44; padding: 1px 4px; font-size: 0.6rem; margin-left: 5px; }
    </style>
</head>
<body>
    <div class="top-nav"><button class="theme-toggle" onclick="toggleTheme()">🌓 Toggle Mode</button></div>
    <div class="ticker-wrap"><div class="ticker" id="ticker-content">Syncing global signal...</div></div>
    <div class="header"><h1>The Signal</h1><p><i>A Curated Newsfeed for the Black Community</i></p></div>
    <input type="text" id="searchBar" placeholder="Search the signal..." onkeyup="filterSearch()">
    <div id="feed"></div>

    <script>
        // Scoring Keywords [cite: 65-80, 85-90]
        const IMPACT_WORDS = ["policy", "legislation", "federal", "court", "voting", "education", "labor", "housing", "sentencing", "accountability"];
        const PR_PENALTY_WORDS = ["announces", "partnership", "fundraiser", "ribbon cutting", "grant awarded"];

        // Your Curated Sources [cite: 4, 6, 8, 10, 111-125]
        const SOURCES = [
            { name: "The AFRO", url: "https://afro.com/feed/", tier: 300 },
            { name: "Amsterdam News", url: "https://amsterdamnews.com/feed/", tier: 300 },
            { name: "The Root", url: "https://theroot.com/rss", tier: 220 },
            { name: "The Grio", url: "https://thegrio.com/feed", tier: 220 },
            { name: "Dr. Stacey Patton", url: "https://drstaceypatton1865.substack.com/feed", tier: 300 },
            { name: "Don Lemon", url: "https://donlemon.substack.com/feed", tier: 300 },
            { name: "Joy-Ann Reid", url: "https://www.joyannreid.com/feed", tier: 300 },
            { name: "Roland Martin (YT)", url: "https://www.youtube.com/feeds/videos.xml?channel_id=UCvXonL_6f6VatpLeS_vM19g", tier: 300 },
            { name: "African Diaspora News (YT)", url: "https://www.youtube.com/feeds/videos.xml?channel_id=UC6iGstVz-pInL5UunmS_XfA", tier: 300 },
            { name: "Sentencing Project", url: "https://sentencing.substack.com/feed", tier: 220 },
            { name: "Court Accountability", url: "https://courtaccountability.substack.com/feed", tier: 220 },
            { name: "Legalytics", url: "https://legalytics.substack.com/feed", tier: 220 },
            { name: "Data4Democracy", url: "https://data4democracy.substack.com/feed", tier: 220 },
            { name: "Robert Reich", url: "https://robertreich.substack.com/feed", tier: 220 }
        ];

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const target = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', target);
            localStorage.setItem('theme', target);
        }
        if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');

        async function init() {
            let allPosts = [];
            const MAX_TOTAL_STORIES = 15; // Your requested limit
            const MAX_PER_SOURCE = 3;    // DIVERSITY CAP: Max stories per source

            for (const src of SOURCES) {
                try {
                    const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(src.url)}`);
                    const data = await res.json();
                    data.items.forEach(item => {
                        const content = (item.title + " " + item.description).toLowerCase();
                        const scoreData = calculateScore(item, src.tier, content);
                        allPosts.push({ ...item, sourceName: src.name, score: scoreData.total, isImpact: scoreData.isImpact });
                    });
                } catch (e) { console.error("Error with:", src.name); }
            }

            // 1. Sort by score [cite: 42]
            allPosts.sort((a, b) => b.score - a.score);

            // 2. Diversity Selection Logic
            const finalSelection = [];
            const seenHeadlines = new Set();
            const sourceCounts = {};

            for (const post of allPosts) {
                if (finalSelection.length >= MAX_TOTAL_STORIES) break;

                const slug = post.title.toLowerCase().replace(/[^a-z0-9]/g, "").substring(0, 50);
                const source = post.sourceName;

                if (seenHeadlines.has(slug)) continue; // Skip duplicates
                if (!sourceCounts[source]) sourceCounts[source] = 0;
                if (sourceCounts[source] >= MAX_PER_SOURCE) continue; // Skip if source is flooding

                finalSelection.push(post);
                seenHeadlines.add(slug);
                sourceCounts[source]++;
            }

            // 3. Render
            document.getElementById('ticker-content').innerHTML = finalSelection.slice(0, 8).map(p => ` • ${p.title}`).join(' ');
            const container = document.getElementById('feed');
            container.innerHTML = "";
            finalSelection.forEach((post, index) => {
                const div = document.createElement('div');
                div.className = 'article';
                div.innerHTML = `
                    <div class="meta">${post.sourceName} • ${new Date(post.pubDate).toLocaleTimeString()} <span class="score-tag">Score: ${post.score}</span></div>
                    <h2><a href="${post.link}" target="_blank">${post.title}</a> ${post.isImpact ? '<span class="impact-badge">IMPACT</span>' : ''}</h2>
                    <button class="sum-btn" onclick="toggleSummary(${index})">Quick TL;DR</button>
                    <div id="sum-${index}" class="summary-box"><strong>The Core Story:</strong><br>${post.description.replace(/<[^>]*>?/gm, '').substring(0, 300)}...</div>
                `;
                container.appendChild(div);
            });
        }

        function toggleSummary(id) {
            const box = document.getElementById(`sum-${id}`);
            box.style.display = box.style.display === 'block' ? 'none' : 'block';
        }

        function calculateScore(item, tier, content) {
            let score = tier; // Authority Weight [cite: 48, 51-54]
            let impact = false;

            const hoursOld = (new Date() - new Date(item.pubDate)) / 3600000;
            if (hoursOld < 6) score += 250; // Recency Weight [cite: 57-58]

            if (IMPACT_WORDS.some(word => content.includes(word))) { 
                score += 300; // Structural Impact Boost [cite: 64, 81]
                impact = true; 
            }
            
            if (tier <= 100 && PR_PENALTY_WORDS.some(word => content.includes(word))) {
                score -= 150; // Press Release Penalty [cite: 83, 91]
            }

            return { total: Math.max(0, score), isImpact: impact };
        }

        function filterSearch() {
            const val = document.getElementById('searchBar').value.toLowerCase();
            document.querySelectorAll('.article').forEach(el => {
                el.style.display = el.innerText.toLowerCase().includes(val) ? 'block' : 'none';
            });
        }
        init();
    </script>
</body>
</html>
