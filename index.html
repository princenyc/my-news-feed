<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black News Aggregator</title>
    <style>
        :root { --bg: #ffffff; --text: #1a1a1a; --accent: #5c5c5c; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", serif; line-height: 1.6; max-width: 800px; margin: 40px auto; padding: 20px; background: var(--bg); color: var(--text); }
        h1 { font-size: 1.5rem; border-bottom: 2px solid #eee; padding-bottom: 10px; font-weight: 700; }
        .feed-container { margin-top: 20px; }
        .article { margin-bottom: 25px; border-bottom: 1px solid #f0f0f0; padding-bottom: 15px; }
        .article h2 { font-size: 1.2rem; margin: 0 0 5px 0; color: #000; }
        .article a { text-decoration: none; color: inherit; }
        .article a:hover { text-decoration: underline; color: #0056b3; }
        .meta { font-size: 0.85rem; color: var(--accent); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .description { font-size: 0.95rem; color: #444; }
        #loading { font-style: italic; color: #888; }
    </style>
</head>
<body>

    <h1>News Aggregator</h1>
    <div id="loading">Gathering the latest stories...</div>
    <div id="feed" class="feed-container"></div>

    <script>
        // These are the links from your document!
        const RSS_FEEDS = [
            'https://thegrio.com/feed',
            'https://theroot.com/rss',
            'https://newsone.com/feed',
            'https://afro.com/feed',
            'https://www.blackenterprise.com/feed',
            'https://eurweb.com/feed',
            'https://bossip.com/feed',
            'https://africanamericans.einnews.com/rss',
            'https://amsterdamnews.com/feed/',
            'https://atlantadailyworld.com/feed/',
            'https://www.washingtoninformer.com/feed/',
            'https://chicagodefender.com/feed/'
        ];

        // We use a helper service (rss2json) to read the feeds because of web security rules
        async function fetchFeeds() {
            const feedContainer = document.getElementById('feed');
            const loadingNote = document.getElementById('loading');
            
            try {
                const allArticles = [];

                for (const url of RSS_FEEDS) {
                    const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`);
                    const data = await response.json();
                    if (data.items) {
                        data.items.forEach(item => {
                            item.sourceName = data.feed.title;
                            allArticles.push(item);
                        });
                    }
                }

                // Sort by newest first
                allArticles.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

                loadingNote.style.display = 'none';
                
                allArticles.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'article';
                    div.innerHTML = `
                        <div class="meta">${item.sourceName} • ${new Date(item.pubDate).toLocaleDateString()}</div>
                        <h2><a href="${item.link}" target="_blank">${item.title}</a></h2>
                        <div class="description">${item.description.replace(/<[^>]*>?/gm, '').substring(0, 180)}...</div>
                    `;
                    feedContainer.appendChild(div);
                });
            } catch (error) {
                loadingNote.innerText = "Failed to load news. Please try again later.";
                console.error(error);
            }
        }

        fetchFeeds();
    </script>
</body>
</html>
