<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Signal v6</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #060608;
            --panel: rgba(10,10,14,0.97);
            --border: rgba(255,255,255,0.08);
            --accent: #ff3030;
            --news: #ff3030;
            --sports: #3a9fff;
            --culture: #f5a623;
            --mainstream: #aaaaaa;
            --text: #e8e8e8;
            --muted: #555;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ── MAP ── */
        #map { flex: 1; height: 100vh; }
        .leaflet-tile { filter: brightness(0.35) contrast(1.3) saturate(0.4) hue-rotate(200deg); }
        .leaflet-popup-content-wrapper {
            background: #0d0d10;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.8);
            font-family: 'DM Sans', sans-serif;
        }
        .leaflet-popup-tip { background: #0d0d10; }
        .leaflet-popup-content { font-size: 0.8rem; line-height: 1.5; }
        .leaflet-popup-content a { color: var(--accent); text-decoration: none; font-weight: 600; }

        /* Cluster overrides */
        .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large {
            background: rgba(255,48,48,0.15) !important;
        }
        .marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div {
            background: rgba(255,48,48,0.5) !important;
            color: #fff !important;
            font-family: 'Space Mono', monospace !important;
            font-size: 0.6rem !important;
        }

        /* ── HUD ── */
        .hud {
            position: absolute;
            top: 20px; left: 20px;
            width: 260px;
            z-index: 1000;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 60px rgba(0,0,0,0.9);
        }

        .hud-title {
            font-family: 'DM Serif Display', serif;
            font-size: 1.3rem;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .hud-sub {
            font-family: 'Space Mono', monospace;
            font-size: 0.55rem;
            color: #0f0;
            margin: 6px 0 14px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            line-height: 1.6;
        }

        .filter-item {
            display: flex; align-items: center; gap: 10px;
            margin-top: 10px;
            font-family: 'Space Mono', monospace;
            font-size: 0.62rem;
            font-weight: 700;
            cursor: pointer;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid transparent;
            opacity: 0.35;
            transition: all 0.25s;
            user-select: none;
        }
        .filter-item.active { opacity: 1; border-color: var(--border); background: rgba(255,255,255,0.04); }
        .filter-item:hover { opacity: 0.8; }
        .dot { height: 8px; width: 8px; border-radius: 50%; flex-shrink: 0; }

        .refresh-btn {
            margin-top: 14px;
            width: 100%;
            padding: 7px;
            background: rgba(255,48,48,0.1);
            border: 1px solid rgba(255,48,48,0.3);
            color: var(--accent);
            font-family: 'Space Mono', monospace;
            font-size: 0.6rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.2s;
        }
        .refresh-btn:hover { background: rgba(255,48,48,0.2); }

        /* ── SIDEBAR ── */
        .sidebar {
            width: 400px;
            height: 100vh;
            background: #08080b;
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 1001;
        }

        .sidebar-header {
            padding: 20px 22px 14px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .sidebar-header h2 {
            font-family: 'Space Mono', monospace;
            font-size: 0.6rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .sidebar-tabs {
            display: flex;
            gap: 0;
            margin-top: 12px;
        }

        .tab-btn {
            flex: 1;
            padding: 6px 4px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            font-family: 'Space Mono', monospace;
            font-size: 0.52rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }
        .tab-btn:first-child { border-radius: 4px 0 0 4px; }
        .tab-btn:last-child { border-radius: 0 4px 4px 0; }
        .tab-btn.active { background: rgba(255,255,255,0.08); color: var(--text); border-color: rgba(255,255,255,0.15); }

        .sidebar-feed {
            flex: 1;
            overflow-y: auto;
            padding: 16px 22px;
            scrollbar-width: thin;
            scrollbar-color: #222 transparent;
        }

        /* ── CARDS ── */
        .story-card {
            background: #0f0f13;
            border: 1px solid var(--border);
            border-left: 3px solid transparent;
            border-radius: 6px;
            padding: 14px;
            margin-bottom: 10px;
            display: none;
            transition: border-color 0.2s;
        }
        .story-card:hover { border-color: rgba(255,255,255,0.15); }
        .story-card.visible { display: block; }

        .source-tag {
            font-family: 'Space Mono', monospace;
            font-size: 0.5rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 2px 6px;
            border-radius: 3px;
            display: inline-block;
            color: #000;
            margin-bottom: 8px;
        }

        .story-card h3 {
            font-family: 'DM Serif Display', serif;
            font-size: 0.88rem;
            line-height: 1.4;
            margin-bottom: 6px;
        }

        .story-card h3 a {
            color: var(--text);
            text-decoration: none;
            transition: color 0.2s;
        }
        .story-card h3 a:hover { color: var(--accent); }

        .story-excerpt {
            font-size: 0.7rem;
            color: var(--muted);
            line-height: 1.5;
        }

        /* ── ERROR / LOADING ── */
        .feed-status {
            font-family: 'Space Mono', monospace;
            font-size: 0.6rem;
            color: var(--muted);
            text-align: center;
            padding: 20px;
        }

        .error-tag {
            font-family: 'Space Mono', monospace;
            font-size: 0.55rem;
            color: #ff6b6b;
            padding: 3px 8px;
            background: rgba(255,48,48,0.08);
            border: 1px solid rgba(255,48,48,0.2);
            border-radius: 4px;
            margin-bottom: 6px;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="hud">
    <div class="hud-title">The Signal</div>
    <div class="hud-sub" id="status">INITIALIZING FEEDS...</div>
    <div id="btn-news"          class="filter-item active" onclick="toggleLayer('news')">        <div class="dot" style="background:var(--news)"></div> COMMUNITY NEWS</div>
    <div id="btn-mainstream"    class="filter-item active" onclick="toggleLayer('mainstream')">  <div class="dot" style="background:var(--mainstream)"></div> IMPACT (AP/NPR)</div>
    <div id="btn-sports"        class="filter-item active" onclick="toggleLayer('sports')">      <div class="dot" style="background:var(--sports)"></div> SPORTS & LABOR</div>
    <div id="btn-entertainment" class="filter-item active" onclick="toggleLayer('entertainment')"><div class="dot" style="background:var(--culture)"></div> CULTURE & ARTS</div>
    <button class="refresh-btn" onclick="refreshFeeds()">↻ REFRESH</button>
</div>

<div id="map"></div>

<div class="sidebar">
    <div class="sidebar-header">
        <h2>Systemic Intelligence — National</h2>
        <div class="sidebar-tabs">
            <button class="tab-btn active" onclick="switchTab('all', this)">ALL</button>
            <button class="tab-btn" onclick="switchTab('news', this)">NEWS</button>
            <button class="tab-btn" onclick="switchTab('mainstream', this)">IMPACT</button>
            <button class="tab-btn" onclick="switchTab('sports', this)">SPORTS</button>
            <button class="tab-btn" onclick="switchTab('entertainment', this)">CULTURE</button>
        </div>
    </div>
    <div class="sidebar-feed" id="national-feed">
        <div class="feed-status">Loading...</div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>

// ── GEO: sorted longest-first to prevent short keys shadowing longer ones ──
const GEODATA_RAW = {
    "washington dc": [38.9072, -77.0369],
    "los angeles":   [34.0522, -118.2437],
    "new orleans":   [29.9511, -90.0715],
    "st. louis":     [38.6270, -90.1994],
    "saint louis":   [38.6270, -90.1994],
    "minneapolis":   [44.9778, -93.2650],
    "birmingham":    [33.5186, -86.8104],
    "jacksonville":  [30.3322, -81.6557],
    "memphis":       [35.1495, -90.0490],
    "richmond":      [37.5407, -77.4360],
    "columbus":      [39.9612, -82.9988],
    "charlotte":     [35.2271, -80.8431],
    "baltimore":     [39.2904, -76.6122],
    "houston":       [29.7604, -95.3698],
    "detroit":       [42.3314, -83.0458],
    "chicago":       [41.8781, -87.6298],
    "atlanta":       [33.7490, -84.3880],
    "oakland":       [37.8044, -122.2712],
    "dallas":        [32.7767, -96.7970],
    "denver":        [39.7392, -104.9903],
    "miami":         [25.7617, -80.1918],
    "philly":        [39.9526, -75.1652],
    "newark":        [40.7357, -74.1724],
    "boston":        [42.3601, -71.0589],
    "harlem":        [40.8116, -73.9465],
    "bronx":         [40.8448, -73.8648],
    "brooklyn":      [40.6782, -73.9442],
    "georgia":       [32.1656, -82.9001],
    "alabama":       [32.3617, -86.2792],
    "florida":       [27.9944, -81.7603],
    "texas":         [31.9686, -99.9018],
    "ohio":          [40.4173, -82.9071],
    "louisiana":     [30.9843, -91.9623],
    "virginia":      [37.4316, -78.6569],
    "the a":         [33.7490, -84.3880],
    "dmv":           [38.9072, -77.0369],
    "nola":          [29.9511, -90.0715],
    "nyc":           [40.7128, -74.0060],
    "l.a.":          [34.0522, -118.2437],
    "dc":            [38.9072, -77.0369],
};

// Sort by key length descending so "los angeles" matches before "la"
const GEODATA = Object.entries(GEODATA_RAW).sort((a, b) => b[0].length - a[0].length);

const IMPACT_WORDS = ["policy","legislation","federal","court","voting","reparations","wealth gap",
    "civil rights","innovation","investment","capital","reform","justice","equity",
    "labor","leadership","housing","election","tech","protest","prison","police",
    "discrimination","settlement","ruling","supreme court","congress","senate","bill","law"];

const SOURCES = [
    // Community News
    { name: "Capital B",        url: "https://capitalbnews.org/feed/",                                      cat: "news",          color: "#ff3030" },
    { name: "The Root",         url: "https://www.theroot.com/rss",                                         cat: "news",          color: "#ff3030" },
    { name: "Black Enterprise", url: "https://www.blackenterprise.com/feed/",                               cat: "news",          color: "#ff3030" },
    { name: "Atlanta Voice",    url: "https://theatlantavoice.com/feed/",                                   cat: "news",          color: "#ff3030" },
    { name: "Blavity",          url: "https://blavity.com/feed",                                            cat: "news",          color: "#ff3030" },
    { name: "Chicago Defender", url: "https://chicagodefender.com/feed/",                                   cat: "news",          color: "#ff3030" },
    { name: "Michigan Chronicle",url:"https://michiganchronicle.com/feed/",                                 cat: "news",          color: "#ff3030" },
    { name: "Afro Baltimore",   url: "https://afro.com/feed/",                                              cat: "news",          color: "#ff3030" },
    { name: "Houston Forward Times", url: "https://forwardtimes.com/feed/",                                 cat: "news",          color: "#ff3030" },
    // Mainstream (filtered by IMPACT_WORDS)
    { name: "NPR",              url: "https://feeds.npr.org/1001/rss.xml",                                  cat: "mainstream",    color: "#aaaaaa" },
    { name: "AP News",          url: "https://news.google.com/rss/search?q=when:24h+racial+equity+OR+civil+rights+OR+Black+Americans", cat: "mainstream", color: "#aaaaaa" },
    { name: "ProPublica",       url: "https://www.propublica.org/feeds/propublica/main",                    cat: "mainstream",    color: "#aaaaaa" },
    { name: "Marshall Project", url: "https://feeds.themarshallproject.org/marshall-project-all",           cat: "mainstream",    color: "#aaaaaa" },
    // Sports
    { name: "Andscape",         url: "https://andscape.com/feed",                                          cat: "sports",        color: "#3a9fff" },
    { name: "The Undefeated",   url: "https://theundefeated.com/feed/",                                    cat: "sports",        color: "#3a9fff" },
    // Culture / Entertainment
    { name: "Essence",          url: "https://www.essence.com/feed/",                                      cat: "entertainment", color: "#f5a623" },
    { name: "Vibe",             url: "https://www.vibe.com/feed/",                                         cat: "entertainment", color: "#f5a623" },
    { name: "theJasmineBrand",  url: "https://thejasminebrand.com/feed/",                                  cat: "entertainment", color: "#f5a623" },
    { name: "Okayplayer",       url: "https://www.okayplayer.com/feed",                                    cat: "entertainment", color: "#f5a623" },
];

// ── STATE ──
let map;
let clusterGroups = {};
let activeTab = 'all';
const seenTitles = new Set(); // dedup tracker

// ── MAP INIT ──
function initMap() {
    map = L.map('map', { zoomControl: false, attributionControl: false }).setView([37.8, -96], 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    ['news','sports','entertainment','mainstream'].forEach(cat => {
        clusterGroups[cat] = L.markerClusterGroup({
            maxClusterRadius: 50,
            iconCreateFunction: (cluster) => {
                const colors = { news:'#ff3030', sports:'#3a9fff', entertainment:'#f5a623', mainstream:'#aaaaaa' };
                return L.divIcon({
                    html: `<div style="background:${colors[cat]};color:#000;font-family:'Space Mono',monospace;font-size:0.6rem;font-weight:700;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,0.3)">${cluster.getChildCount()}</div>`,
                    className: '', iconSize: [32, 32], iconAnchor: [16, 16]
                });
            }
        });
        clusterGroups[cat].addTo(map);
    });
}

// ── DETERMINISTIC JITTER from URL hash ──
function hashJitter(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
    return ((h & 0xffff) / 0xffff - 0.5) * 0.3;
}

// ── GEO SCAN: first match wins (sorted longest key first) ──
function deepScan(text) {
    const lower = text.toLowerCase();
    for (const [key, coord] of GEODATA) {
        // word-boundary check: key must be surrounded by non-alpha chars
        const idx = lower.indexOf(key);
        if (idx === -1) continue;
        const before = lower[idx - 1];
        const after  = lower[idx + key.length];
        const okBefore = (idx === 0) || /[^a-z]/.test(before);
        const okAfter  = (idx + key.length >= lower.length) || /[^a-z]/.test(after);
        if (okBefore && okAfter) return coord;
    }
    return null;
}

// ── DEDUP: normalize title to ~40 char key ──
function dedupKey(title) {
    return title.toLowerCase().replace(/[^a-z0-9]/g, '').substring(0, 40);
}

// ── FEED FETCHING (parallel) ──
async function fetchFeeds() {
    setStatus('SYNCING...');
    seenTitles.clear();
    document.getElementById('national-feed').innerHTML = '<div class="feed-status">Loading...</div>';

    // Clear existing map pins
    Object.values(clusterGroups).forEach(g => g.clearLayers());

    const proxy = "https://api.rss2json.com/v1/api.json?rss_url=";
    const now = Date.now();
    let located = 0, national = 0, errors = 0;

    const results = await Promise.allSettled(
        SOURCES.map(src =>
            fetch(proxy + encodeURIComponent(src.url))
                .then(r => r.json())
                .then(data => ({ src, data }))
        )
    );

    document.getElementById('national-feed').innerHTML = '';

    results.forEach(result => {
        if (result.status === 'rejected') { errors++; return; }
        const { src, data } = result.value;
        if (data.status !== 'ok' || !data.items) { errors++; return; }

        data.items.forEach(item => {
            const hoursOld = (now - new Date(item.pubDate).getTime()) / 3600000;
            if (hoursOld > 24) return;

            const content = (item.title + ' ' + (item.description || '')).toLowerCase();

            // Mainstream filter
            if (src.cat === 'mainstream' && !IMPACT_WORDS.some(w => content.includes(w))) return;

            // Dedup
            const key = dedupKey(item.title);
            if (seenTitles.has(key)) return;
            seenTitles.add(key);

            const coords = deepScan(content);
            if (coords) {
                createPin(item, coords, src);
                located++;
            } else {
                createCard(item, src);
                national++;
            }
        });
    });

    const errTxt = errors > 0 ? ` | FAIL: ${errors}` : '';
    setStatus(`LOCATED: ${located} | SYSTEMIC: ${national}${errTxt}`);
    updateTabVisibility();
}

function setStatus(txt) {
    document.getElementById('status').innerText = txt;
}

// ── MAP PINS ──
function createPin(item, coords, src) {
    const jx = hashJitter(item.link || item.title);
    const jy = hashJitter((item.link || item.title) + '_y');
    const marker = L.circleMarker(
        [coords[0] + jx, coords[1] + jy],
        { radius: 9, fillColor: src.color, color: 'rgba(255,255,255,0.6)', weight: 1.5, fillOpacity: 0.9 }
    );
    const excerpt = (item.description || '').replace(/<[^>]*>?/gm, '').substring(0, 100);
    marker.bindPopup(`
        <div style="min-width:200px; max-width:260px;">
            <div style="font-size:0.55rem; font-weight:900; text-transform:uppercase; color:${src.color}; margin-bottom:5px;">${src.name}</div>
            <div style="font-family:'DM Serif Display',serif; font-size:0.85rem; line-height:1.4; margin-bottom:6px;">
                <a href="${item.link}" target="_blank" rel="noopener">${item.title}</a>
            </div>
            <div style="font-size:0.68rem; color:#888;">${excerpt}...</div>
        </div>
    `);
    clusterGroups[src.cat].addLayer(marker);
}

// ── SIDEBAR CARDS ──
function createCard(item, src) {
    const card = document.createElement('div');
    card.className = `story-card category-${src.cat}`;
    card.style.borderLeftColor = src.color;
    const excerpt = (item.description || '').replace(/<[^>]*>?/gm, '').substring(0, 110);
    card.innerHTML = `
        <div class="source-tag" style="background:${src.color}">${src.name}</div>
        <h3><a href="${item.link}" target="_blank" rel="noopener">${item.title}</a></h3>
        <div class="story-excerpt">${excerpt}...</div>
    `;
    document.getElementById('national-feed').appendChild(card);
}

// ── LAYER TOGGLE ──
function toggleLayer(cat) {
    const btn = document.getElementById(`btn-${cat}`);
    if (map.hasLayer(clusterGroups[cat])) {
        map.removeLayer(clusterGroups[cat]);
        btn.classList.remove('active');
    } else {
        clusterGroups[cat].addTo(map);
        btn.classList.add('active');
    }
    updateTabVisibility();
}

// ── TAB FILTER ──
function switchTab(tab, el) {
    activeTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    updateTabVisibility();
}

function updateTabVisibility() {
    document.querySelectorAll('.story-card').forEach(card => {
        if (activeTab === 'all') {
            card.classList.add('visible');
        } else {
            card.classList.toggle('visible', card.classList.contains(`category-${activeTab}`));
        }
    });
}

function refreshFeeds() { fetchFeeds(); }

// ── BOOT ──
initMap();
fetchFeeds();

</script>
</body>
</html>
