<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Signal: World Monitor 4.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Georgia&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --bg: #F0EEE9; --text: #141414; --accent: #d44; --card: #ffffff; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        /* Map Styling */
        #map { height: 500px; width: 100%; border-radius: 20px; margin-bottom: 30px; border: 2px solid #000; box-shadow: 0 10px 30px rgba(0,0,0,0.1); z-index: 1; }
        .leaflet-tile { filter: grayscale(1) invert(1) opacity(0.2); } /* Minimalist 2026 Map Style */

        .header { text-align: center; margin-bottom: 30px; }
        h1 { font-family: 'Georgia', serif; font-variant: small-caps; font-size: 3rem; margin: 0; }
        .tab-nav { display: flex; gap: 10px; margin-bottom: 30px; justify-content: center; }
        .tab-btn { background: var(--card); border: 1px solid #ddd; padding: 12px 28px; border-radius: 30px; cursor: pointer; font-weight: 600; }
        .tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        #feed { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 25px; }
        .article { background: var(--card); border-radius: 20px; padding: 25px; border: 1px solid rgba(0,0,0,0.05); }
        .meta { font-size: 0.75rem; color: #888; text-transform: uppercase; font-weight: 800; margin-bottom: 10px; }
        footer { margin-top: 50px; padding: 30px; background: rgba(0,0,0,0.05); border-radius: 10px; font-family: monospace; font-size: 0.75rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h1>The Signal</h1><p><i>Geospatial Intelligence for the Black Community</i></p></div>
        
        <div id="map"></div>

        <div class="tab-nav">
            <button class="tab-btn active" onclick="switchCategory('news', this)">Top News</button>
            <button class="tab-btn" onclick="switchCategory('sports', this)">Sports</button>
            <button class="tab-btn" onclick="switchCategory('entertainment', this)">Entertainment</button>
        </div>
        <div id="feed"></div>
    </div>
    <footer><div id="debug-text">Initializing Geospatial Engine...</div></footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // 1. Map Configuration
    let map, markers = [];
    const CITY_COORDS = {
        "atlanta": [33.7490, -84.3880], "chicago": [41.8781, -87.6298], "detroit": [42.3314, -83.0458],
        "baltimore": [39.2904, -76.6122], "philly": [39.9526, -75.1652], "houston": [29.7604, -95.3698],
        "new orleans": [29.9511, -90.0715], "harlem": [40.8116, -73.9465], "dc": [38.9072, -77.0369],
        "oakland": [37.8044, -122.2712], "memphis": [35.1495, -90.0490], "brooklyn": [40.6782, -73.9442]
    };

    const SOURCES = [
        { name: "The Atlanta Voice", url: "https://theatlantavoice.com/feed/", tier: 300, category: "news" },
        { name: "Amsterdam News", url: "https://amsterdamnews.com/feed/", tier: 300, category: "news" },
        { name: "Chicago Defender", url: "https://chicagodefender.com/feed/", tier: 300, category: "news" },
        { name: "Kareem Abdul-Jabbar", url: "https://kareem.substack.com/feed", tier: 300, category: "news" },
        { name: "Andscape", url: "https://andscape.com/feed", tier: 300, category: "sports" },
        { name: "Blavity Entertainment", url: "https://blavity.com/categories/news/entertainment/feed", tier: 280, category: "entertainment" }
    ];

    let allArticles = [], currentCategory = 'news';

    // 2. City Spotter Logic
    function getCoords(text) {
        const lower = text.toLowerCase();
        for (const [city, coord] of Object.entries(CITY_COORDS)) {
            if (lower.includes(city)) return coord;
        }
        return null;
    }

    function initMap() {
        map = L.map('map').setView([37.8, -96], 4);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    }

    async function fetchFeeds() {
        const debug = document.getElementById('debug-text');
        allArticles = [];
        const fetchPromises = SOURCES.map(async (src) => {
            try {
                const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(src.url)}`);
                const data = await res.json();
                if(data.status === "ok") {
                    data.items.forEach(item => {
                        const coords = getCoords(item.title + " " + item.description);
                        allArticles.push({ ...item, source: src.name, category: src.category, coords });
                    });
                }
            } catch (e) { console.warn(src.name + " failed"); }
        });
        await Promise.allSettled(fetchPromises);
        debug.innerText = `World Monitor Live: ${allArticles.length} signals detected.`;
        renderFeed();
    }

    function renderFeed() {
        const container = document.getElementById('feed');
        container.innerHTML = "";
        
        // Clear old markers
        markers.forEach(m => map.removeLayer(m));
        markers = [];

        const filtered = allArticles.filter(a => a.category === currentCategory).slice(0, 20);

        filtered.forEach(post => {
            // Add Map Marker if city spotted
            if (post.coords) {
                const m = L.marker(post.coords).addTo(map)
                    .bindPopup(`<b>${post.source}</b><br>${post.title}`);
                markers.push(m);
            }

            const div = document.createElement('div');
            div.className = 'article';
            div.innerHTML = `
                <div class="meta">${post.source} ${post.coords ? '📍 Spotted' : ''}</div>
                <h2><a href="${post.link}" target="_blank" style="color:inherit; text-decoration:none;">${post.title}</a></h2>
                <p>${post.description.replace(/<[^>]*>?/gm, '').substring(0, 120)}...</p>
            `;
            container.appendChild(div);
        });
    }

    function switchCategory(cat, el) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        currentCategory = cat;
        renderFeed();
    }

    initMap();
    fetchFeeds();
</script>
</body>
</html>
