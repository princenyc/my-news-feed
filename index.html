<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Signal: GEOINT Command v4.2</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --bg: #0a0a0a; --text: #e0e0e0; --accent: #d44; --panel: #1a1a1a; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; overflow: hidden; }
        
        /* Map Command Center */
        #map { height: 100vh; width: 100vw; z-index: 1; }
        .leaflet-tile { filter: brightness(0.4) contrast(1.2) grayscale(1) invert(1); } 

        /* Floating Intelligence Panel */
        .control-panel {
            position: absolute; top: 20px; left: 20px; width: 320px; z-index: 1000;
            background: var(--panel); border: 1px solid #333; border-radius: 12px;
            padding: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        h1 { font-size: 1.5rem; margin: 0 0 5px 0; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
        .layer-toggle { display: flex; align-items: center; gap: 10px; margin-top: 15px; font-size: 0.8rem; font-weight: 800; cursor: pointer; }
        .dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; }

        /* Custom Popup Styling */
        .leaflet-popup-content-wrapper { background: #1a1a1a; color: white; border: 1px solid #444; }
        .leaflet-popup-tip { background: #1a1a1a; }
    </style>
</head>
<body>

    <div class="control-panel">
        <h1>The Signal</h1>
        <p style="font-size: 0.7rem; color: #888; margin-bottom: 20px;">Geospatial Community Intelligence</p>
        
        <div class="layer-toggle" onclick="toggleLayer('news')"><span class="dot" style="background: #ff4444;"></span> NEWS & JUSTICE</div>
        <div class="layer-toggle" onclick="toggleLayer('sports')"><span class="dot" style="background: #44aaff;"></span> SPORTS & LABOR</div>
        <div class="layer-toggle" onclick="toggleLayer('entertainment')"><span class="dot" style="background: #ffaa44;"></span> CULTURE & ARTS</div>
        <div class="layer-toggle" onclick="toggleWeather()"><span class="dot" style="background: #ffffff;"></span> WEATHER OVERLAY</div>
        
        <div id="stats" style="margin-top: 30px; font-size: 0.7rem; opacity: 0.5;">
            Syncing Global Signal...
        </div>
    </div>

    <div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let map, layers = { news: L.layerGroup(), sports: L.layerGroup(), entertainment: L.layerGroup() };
    let weatherLayer = L.tileLayer('https://tile.openweathermap.org/map/temp_new/{z}/{x}/{y}.png?appid=YOUR_API_KEY'); // Placeholder

    const CITY_COORDS = {
        "atlanta": [33.7490, -84.3880], "chicago": [41.8781, -87.6298], "detroit": [42.3314, -83.0458],
        "baltimore": [39.2904, -76.6122], "philly": [39.9526, -75.1652], "houston": [29.7604, -95.3698],
        "new orleans": [29.9511, -90.0715], "harlem": [40.8116, -73.9465], "dc": [38.9072, -77.0369]
    };

    const SOURCES = [
        { name: "Atlanta Voice", url: "https://theatlantavoice.com/feed/", cat: "news", color: "#ff4444" },
        { name: "Amsterdam News", url: "https://amsterdamnews.com/feed/", cat: "news", color: "#ff4444" },
        { name: "Andscape", url: "https://andscape.com/feed", cat: "sports", color: "#44aaff" },
        { name: "Blavity Entertainment", url: "https://blavity.com/categories/news/entertainment/feed", cat: "entertainment", color: "#ffaa44" }
    ];

    function initMap() {
        map = L.map('map', { zoomControl: false }).setView([37.8, -96], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        
        // Add layers to map initially
        Object.values(layers).forEach(l => l.addTo(map));
        fetchFeeds();
    }

    async function fetchFeeds() {
        for (const src of SOURCES) {
            try {
                const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(src.url)}`);
                const data = await res.json();
                data.items.forEach(item => {
                    const coords = spotCity(item.title + " " + item.description);
                    if (coords) createPin(item, coords, src);
                });
            } catch (e) { console.error(src.name); }
        }
        document.getElementById('stats').innerText = "Signal Locked. Diagnostic Green.";
    }

    function spotCity(text) {
        const t = text.toLowerCase();
        for (const [city, coord] of Object.entries(CITY_COORDS)) {
            if (t.includes(city)) return coord;
        }
        return null;
    }

    function createPin(item, coords, src) {
        // Create custom colored circle marker
        const marker = L.circleMarker(coords, {
            radius: 8, fillColor: src.color, color: "#fff", weight: 2, opacity: 1, fillOpacity: 0.8
        });

        const popup = `
            <div style="min-width:200px">
                <strong style="color:${src.color}">${src.name}</strong><br>
                <a href="${item.link}" target="_blank" style="color:#fff; text-decoration:none; font-weight:bold;">${item.title}</a>
            </div>
        `;
        marker.bindPopup(popup).addTo(layers[src.cat]);
    }

    function toggleLayer(type) {
        if (map.hasLayer(layers[type])) map.removeLayer(layers[type]);
        else map.addLayer(layers[type]);
    }

    initMap();
</script>
</body>
</html>
