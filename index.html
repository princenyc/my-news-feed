<script>
    // 1. Data Definitions
    const GEODATA = {
        "atlanta": [33.7490, -84.3880], "the a": [33.7490, -84.3880],
        "chicago": [41.8781, -87.6298], "detroit": [42.3314, -83.0458],
        "baltimore": [39.2904, -76.6122], "philly": [39.9526, -75.1652],
        "houston": [29.7604, -95.3698], "new orleans": [29.9511, -90.0715],
        "harlem": [40.8116, -73.9465], "brooklyn": [40.6782, -73.9442],
        "nyc": [40.7128, -74.0060], "dc": [38.9072, -77.0369]
    };

    const SOURCES = [
        { name: "Capital B", url: "https://capitalbnews.org/feed/", cat: "news", color: "#ff4444" },
        { name: "Atlanta Voice", url: "https://theatlantavoice.com/feed/", cat: "news", color: "#ff4444" },
        { name: "Amsterdam News", url: "https://amsterdamnews.com/feed/", cat: "news", color: "#ff4444" },
        { name: "Black Enterprise", url: "https://www.blackenterprise.com/feed/", cat: "news", color: "#ff4444" },
        { name: "Andscape", url: "https://andscape.com/feed", cat: "sports", color: "#44aaff" },
        { name: "UrbanGeekz", url: "https://urbangeekz.com/feed/", cat: "news", color: "#00ffcc" },
        { name: "Blavity", url: "https://blavity.com/categories/news/entertainment/feed", cat: "entertainment", color: "#ffaa44" }
    ];

    let map, weatherRadar;
    // Categories mapped to Leaflet LayerGroups
    let layers = { 
        news: L.layerGroup(), 
        sports: L.layerGroup(), 
        entertainment: L.layerGroup() 
    };

    function initMap() {
        map = L.map('map', { zoomControl: false, attributionControl: false }).setView([37.8, -96], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        
        // Add all layers to map initially
        layers.news.addTo(map);
        layers.sports.addTo(map);
        layers.entertainment.addTo(map);
        
        weatherRadar = L.tileLayer('https://tile.openweathermap.org/map/precipitation_new/{z}/{x}/{y}.png?appid=YOUR_API_KEY');
        fetchFeeds();
    }

    async function fetchFeeds() {
        let located = 0, national = 0;
        document.getElementById('national-feed').innerHTML = "";

        for (const src of SOURCES) {
            try {
                // Use RSS2JSON for clean parsing
                const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(src.url)}`);
                const data = await res.json();
                
                data.items.forEach(item => {
                    const hoursOld = (new Date() - new Date(item.pubDate)) / 3600000;
                    // Strict 24-hour limit
                    if (hoursOld <= 24) {
                        const coords = deepScan(item.title + " " + item.description);
                        if (coords) {
                            createPin(item, coords, src);
                            located++;
                        } else {
                            createCard(item, src);
                            national++;
                        }
                    }
                });
            } catch (e) { console.error("Source Failed: " + src.name); }
        }
        document.getElementById('status').innerText = `LOCATED: ${located} | NATIONAL: ${national}`;
    }

    function deepScan(text) {
        const content = text.toLowerCase();
        for (const [city, coord] of Object.entries(GEODATA)) {
            if (content.includes(city)) return coord;
        }
        return null;
    }

    function createPin(item, coords, src) {
        const jitter = () => (Math.random() - 0.5) * 0.15; 
        
        // Funnel marker into the specific category layer
        const marker = L.circleMarker([coords[0] + jitter(), coords[1] + jitter()], {
            radius: 10, 
            fillColor: src.color, 
            color: "#fff", 
            weight: 2, 
            fillOpacity: 0.9
        }).addTo(layers[src.cat]); // This line fixes the filtering!

        marker.bindPopup(`
            <div style="min-width:180px; font-family:Inter;">
                <span style="font-size:0.6rem; color:${src.color}; font-weight:800;">${src.name.toUpperCase()}</span>
                <h4 style="margin:5px 0;"><a href="${item.link}" target="_blank" style="color:#ff3e3e; text-decoration:none;">${item.title}</a></h4>
            </div>
        `);
    }

    function createCard(item, src) {
        const card = document.createElement('div');
        // Add a class for category filtering in the sidebar later
        card.className = `story-card category-${src.cat}`; 
        card.innerHTML = `
            <div class="source-tag" style="background:${src.color}">${src.name}</div>
            <h3><a href="${item.link}" target="_blank">${item.title}</a></h3>
            <p style="font-size:0.7rem; color:#666; margin:0;">${item.description.replace(/<[^>]*>?/gm, '').substring(0, 80)}...</p>
        `;
        document.getElementById('national-feed').appendChild(card);
    }

    // Toggle logic for the HUD buttons
    function toggleLayer(t) {
        if (map.hasLayer(layers[t])) {
            map.removeLayer(layers[t]);
            // Optional: Hide sidebar stories for this category too
            document.querySelectorAll(`.category-${t}`).forEach(el => el.style.display = 'none');
        } else {
            map.addLayer(layers[t]);
            document.querySelectorAll(`.category-${t}`).forEach(el => el.style.display = 'block');
        }
    }

    function toggleWeather() {
        map.hasLayer(weatherRadar) ? map.removeLayer(weatherRadar) : weatherRadar.addTo(map);
    }

    initMap();
</script>
