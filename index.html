<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Signal v7</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #060608;
            --panel: rgba(10,10,14,0.97);
            --border: rgba(255,255,255,0.08);
            --accent: #ff3030;
            --news: #ff3030;
            --sports: #3a9fff;
            --hbcu: #00e5a0;
            --culture: #f5a623;
            --mainstream: #aaaaaa;
            --text: #e8e8e8;
            --muted: #555;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ── MAP ── */
        #map { flex: 1; height: 100vh; }
        .leaflet-tile { filter: brightness(0.35) contrast(1.3) saturate(0.4) hue-rotate(200deg); }
        .leaflet-popup-content-wrapper {
            background: #0d0d10;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.8);
            font-family: 'DM Sans', sans-serif;
        }
        .leaflet-popup-tip { background: #0d0d10; }
        .leaflet-popup-content { font-size: 0.8rem; line-height: 1.5; }
        .leaflet-popup-content a { color: var(--accent); text-decoration: none; font-weight: 600; }

        /* ── HUD ── */
        .hud {
            position: absolute;
            top: 20px; left: 20px;
            width: 265px;
            z-index: 1000;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 60px rgba(0,0,0,0.9);
        }

        .hud-title {
            font-family: 'DM Serif Display', serif;
            font-size: 1.3rem;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .hud-sub {
            font-family: 'Space Mono', monospace;
            font-size: 0.52rem;
            color: #0f0;
            margin: 6px 0 14px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            line-height: 1.7;
        }

        .hud-section-label {
            font-family: 'Space Mono', monospace;
            font-size: 0.48rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 12px;
            margin-bottom: 2px;
            padding-left: 2px;
        }

        .filter-item {
            display: flex; align-items: center; gap: 10px;
            margin-top: 6px;
            font-family: 'Space Mono', monospace;
            font-size: 0.6rem;
            font-weight: 700;
            cursor: pointer;
            padding: 7px 10px;
            border-radius: 6px;
            border: 1px solid transparent;
            opacity: 0.35;
            transition: all 0.25s;
            user-select: none;
        }
        .filter-item.active { opacity: 1; border-color: var(--border); background: rgba(255,255,255,0.04); }
        .filter-item:hover { opacity: 0.8; }
        .dot { height: 8px; width: 8px; border-radius: 50%; flex-shrink: 0; }

        .refresh-btn {
            margin-top: 14px;
            width: 100%;
            padding: 7px;
            background: rgba(255,48,48,0.1);
            border: 1px solid rgba(255,48,48,0.3);
            color: var(--accent);
            font-family: 'Space Mono', monospace;
            font-size: 0.6rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.2s;
        }
        .refresh-btn:hover { background: rgba(255,48,48,0.2); }

        /* ── SIDEBAR ── */
        .sidebar {
            width: 400px;
            height: 100vh;
            background: #08080b;
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 1001;
        }

        .sidebar-header {
            padding: 20px 22px 14px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .sidebar-header h2 {
            font-family: 'Space Mono', monospace;
            font-size: 0.6rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .sidebar-tabs {
            display: flex;
            gap: 0;
            margin-top: 12px;
            flex-wrap: wrap;
            gap: 2px;
        }

        .tab-btn {
            flex: 1;
            min-width: fit-content;
            padding: 6px 6px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            font-family: 'Space Mono', monospace;
            font-size: 0.48rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all 0.2s;
            border-radius: 3px;
        }
        .tab-btn.active { background: rgba(255,255,255,0.08); color: var(--text); border-color: rgba(255,255,255,0.15); }

        .sidebar-feed {
            flex: 1;
            overflow-y: auto;
            padding: 16px 22px;
            scrollbar-width: thin;
            scrollbar-color: #222 transparent;
        }

        /* ── CARDS ── */
        .story-card {
            background: #0f0f13;
            border: 1px solid var(--border);
            border-left: 3px solid transparent;
            border-radius: 6px;
            padding: 14px;
            margin-bottom: 10px;
            display: none;
            transition: border-color 0.2s;
        }
        .story-card:hover { border-color: rgba(255,255,255,0.15); }
        .story-card.visible { display: block; }

        .source-tag {
            font-family: 'Space Mono', monospace;
            font-size: 0.5rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 2px 6px;
            border-radius: 3px;
            display: inline-block;
            color: #000;
            margin-bottom: 8px;
        }

        .story-card h3 {
            font-family: 'DM Serif Display', serif;
            font-size: 0.88rem;
            line-height: 1.4;
            margin-bottom: 6px;
        }

        .story-card h3 a {
            color: var(--text);
            text-decoration: none;
            transition: color 0.2s;
        }
        .story-card h3 a:hover { color: var(--accent); }

        .story-excerpt {
            font-size: 0.7rem;
            color: var(--muted);
            line-height: 1.5;
        }

        .feed-status {
            font-family: 'Space Mono', monospace;
            font-size: 0.6rem;
            color: var(--muted);
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

// ── MAP INIT ──
function initMap() {
    map = L.map('map', { zoomControl: false, attributionControl: false }).setView([37.8, -96], 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    Object.keys(CAT_COLORS).forEach(cat => {
        clusterGroups[cat] = L.markerClusterGroup({
            maxClusterRadius: 50,
            iconCreateFunction: (cluster) => L.divIcon({
                html: `<div style="background:${CAT_COLORS[cat]};color:#000;font-family:'Space Mono',monospace;font-size:0.58rem;font-weight:700;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,0.25)">${cluster.getChildCount()}</div>`,

            })
        });
        clusterGroups[cat].addTo(map);
    });
}

// ── DETERMINISTIC JITTER ──
function hashJitter(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
    return ((h & 0xffff) / 0xffff - 0.5) * 0.3;
}

// ── GEO SCAN ──
function deepScan(text) {
    const lower = text.toLowerCase();
    for (const [key, coord] of GEODATA) {
        const idx = lower.indexOf(key);
        if (idx === -1) continue;
        const before = lower[idx - 1];
        const after  = lower[idx + key.length];
        const okBefore = (idx === 0) || /[^a-z]/.test(before);
        const okAfter  = (idx + key.length >= lower.length) || /[^a-z]/.test(after);
        if (okBefore && okAfter) return coord;
    }
    return null;
}

// For city sports sources, use known city coords directly
function cityCoords(cityKey) {
    return GEODATA_RAW[cityKey] || null;
}

// ── DEDUP ──
function dedupKey(title) {
    return title.toLowerCase().replace(/[^a-z0-9]/g, '').substring(0, 40);
}

// ── XML PARSER (no third-party dependency) ──
function parseRSS(xml) {
    if (!xml) return [];
    const items = [];
    const isAtom = /<feed[\s>]/i.test(xml);
    const tag = isAtom ? 'entry' : 'item';
    const blockRe = new RegExp(`<${tag}[\\s>]([\\s\\S]*?)<\\/${tag}>`, 'gi');
    let m;
    while ((m = blockRe.exec(xml)) !== null) {
        const b = m[1];
        const title   = extractXml(b, 'title');
        const link    = extractLink(b, isAtom);
        const pubDate = extractXml(b, isAtom ? 'updated' : 'pubDate') || extractXml(b, 'dc:date') || extractXml(b, 'published');
        const desc    = extractXml(b, 'description') || extractXml(b, 'summary') || extractXml(b, 'content');
        if (!title && !link) continue;
        items.push({
            title:       decodeEnt(stripTags(title)).trim(),
            link:        link.trim(),
            pubDate:     pubDate.trim(),
            description: decodeEnt(stripTags(desc)).substring(0, 300).trim(),
        });
    }
    return items;
}

function extractXml(block, tag) {
    const re = new RegExp(`<${tag}[^>]*>(?:<!\\[CDATA\\[([\\s\\S]*?)\\]\\]>|([\\s\\S]*?))<\\/${tag}>`, 'i');
    const m = block.match(re);
    if (!m) return '';
    return (m[1] !== undefined ? m[1] : m[2]) || '';
}

function extractLink(block, isAtom) {
    if (isAtom) {
        const h = block.match(/<link[^>]+href="([^"]+)"/i);
        if (h) return h[1];
    }
    const m = block.match(/<link[^>]*>([^<]+)<\/link>/i);
    return m ? m[1].trim() : '';
}

function stripTags(s) { return (s||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' '); }

function decodeEnt(s) {
    return (s||'')
        .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
        .replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&apos;/g,"'")
        .replace(/&#8217;/g,'’').replace(/&#8220;/g,'“').replace(/&#8221;/g,'”')
        .replace(/&#\d+;/g,'');
}

// ── FEED FETCHING ──
async function fetchFeeds() {
    setStatus('SYNCING...');
    seenTitles.clear();
    document.getElementById('national-feed').innerHTML = '<div class="feed-status">Loading...</div>';
    Object.values(clusterGroups).forEach(g => g.clearLayers());

    // allorigins.win: free CORS proxy, no rate limits, no API key
    const PROXY = "https://api.allorigins.win/get?url=";

    const now = Date.now();
    let located = 0, national = 0, errors = 0;

    const results = await Promise.allSettled(
        ALL_SOURCES.map(src =>
            fetch(PROXY + encodeURIComponent(src.url))
                .then(r => r.json())
                .then(envelope => {
                    const items = parseRSS(envelope.contents || '');
                    return { src, data: { ok: true, items } };
                })
        )
    );

    document.getElementById('national-feed').innerHTML = '';

    results.forEach(result => {
        if (result.status === 'rejected') { errors++; return; }
        const { src, data } = result.value;
        if (!data.ok || !data.items) { errors++; return; }

        data.items.forEach(item => {
            const hoursOld = (now - new Date(item.pubDate).getTime()) / 3600000;
            if (hoursOld > 36) return; // slightly wider window for HBCU/city sports

            const content = (item.title + ' ' + (item.description || '')).toLowerCase();

            // Mainstream: impact filter
            if (src.cat === 'mainstream' && !IMPACT_WORDS.some(w => content.includes(w))) return;

            // City sports: signal filter — drop pure score/recap stories
            if (src.cat === 'citysports' && !SPORTS_SIGNAL.some(w => content.includes(w))) return;

            // Dedup
            const key = dedupKey(item.title);
            if (seenTitles.has(key)) return;
            seenTitles.add(key);

            // City sports: pin directly to city, don't need deepScan
            if (src.cat === 'citysports' && src.city) {
                const coords = cityCoords(src.city);
                if (coords) { createPin(item, coords, src); located++; return; }
            }

            const coords = deepScan(content);
            if (coords) {
                createPin(item, coords, src);
                located++;
            } else {
                createCard(item, src);
                national++;
            }
        });
    });

    const errTxt = errors > 0 ? ` | FAIL: ${errors}` : '';
    setStatus(`LOCATED: ${located} | SYSTEMIC: ${national}${errTxt}`);
    updateTabVisibility();
}

function setStatus(txt) { document.getElementById('status').innerText = txt; }

// ── MAP PINS ──
function createPin(item, coords, src) {
    const jx = hashJitter(item.link || item.title);
    const jy = hashJitter((item.link || item.title) + '_y');
    const marker = L.circleMarker(
        [coords[0] + jx, coords[1] + jy],
        { radius: 9, fillColor: src.color, color: 'rgba(255,255,255,0.5)', weight: 1.5, fillOpacity: 0.9 }
    );
    const excerpt = (item.description || '').replace(/<[^>]*>?/gm, '').substring(0, 100);
    marker.bindPopup(`
        <div style="min-width:200px; max-width:260px;">
            <div style="font-size:0.55rem; font-weight:900; text-transform:uppercase; color:${src.color}; margin-bottom:5px; letter-spacing:1px;">${src.name}</div>
            <div style="font-family:'DM Serif Display',serif; font-size:0.85rem; line-height:1.4; margin-bottom:6px;">
                <a href="${item.link}" target="_blank" rel="noopener">${item.title}</a>
            </div>
            <div style="font-size:0.68rem; color:#888; line-height:1.4;">${excerpt}...</div>
        </div>
    `);
    clusterGroups[src.cat].addLayer(marker);
}

// ── SIDEBAR CARDS ──
function createCard(item, src) {
    const card = document.createElement('div');
    card.className = `story-card category-${src.cat}`;
    card.style.borderLeftColor = src.color;
    const excerpt = (item.description || '').replace(/<[^>]*>?/gm, '').substring(0, 110);
    card.innerHTML = `
        <div class="source-tag" style="background:${src.color}">${src.name}</div>
        <h3><a href="${item.link}" target="_blank" rel="noopener">${item.title}</a></h3>
        <div class="story-excerpt">${excerpt}...</div>
    `;
    document.getElementById('national-feed').appendChild(card);
}

// ── LAYER TOGGLE ──
function toggleLayer(cat) {
    const btn = document.getElementById(`btn-${cat}`);
    if (map.hasLayer(clusterGroups[cat])) {
        map.removeLayer(clusterGroups[cat]);
        btn.classList.remove('active');
    } else {
        clusterGroups[cat].addTo(map);
        btn.classList.add('active');
    }
    updateTabVisibility();
}

// ── TAB FILTER ──
function switchTab(tab, el) {
    activeTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    updateTabVisibility();
}

function updateTabVisibility() {
    document.querySelectorAll('.story-card').forEach(card => {
        if (activeTab === 'all') {
            card.classList.add('visible');
        } else {
            card.classList.toggle('visible', card.classList.contains(`category-${activeTab}`));
        }
    });
}

function refreshFeeds() { fetchFeeds(); }

// ── BOOT ──
initMap();
fetchFeeds();
</script>
